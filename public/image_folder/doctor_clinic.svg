<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="60%" stop-color="#132f57"/>
      <stop offset="100%" stop-color="#081729"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8911f"/>
      <stop offset="50%" stop-color="#e3c04f"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1f3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#glow1)"/>
  <!-- Architectural grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Clinic emblem / medical crest on left -->
  <g transform="translate(170, 240)">
    <circle cx="0" cy="0" r="102" fill="#081729" stroke="url(#gold1)" stroke-width="3"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Stylized blood drop + stethoscope / medical cross -->
    <path d="M0 -52 C26 -18 42 4 42 26 A42 42 0 1 1 -42 26 C-42 4 -26 -18 0 -52 Z" fill="#b91c1c" stroke="#f8fafc" stroke-width="2.5"/>
    <path d="M-12 22 L12 22 M0 10 L0 34" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Map pin mark at bottom -->
    <circle cx="58" cy="58" r="22" fill="url(#gold1)"/>
    <path d="M58 47 C52.5 47 48 51.3 48 56.8 C48 63.8 58 72 58 72 C58 72 68 63.8 68 56.8 C68 51.3 63.5 47 58 47 Z" fill="#0b1f3a"/>
    <circle cx="58" cy="56.5" r="3.5" fill="#c9a227"/>
  </g>
  <!-- Doctor title block (RTL aligned right) -->
  <g transform="translate(720, 165)" text-anchor="end" font-family="Noto Kufi Arabic, Arial, sans-serif">
    <text x="0" y="0" fill="#c9a227" font-size="20" font-weight="700">العيادة التخصصية الاستشارية</text>
    <text x="0" y="56" fill="#ffffff" font-size="40" font-weight="800">د. غيث التميمي</text>
    <rect x="-220" y="78" width="220" height="3.5" rx="2" fill="url(#gold1)"/>
    <text x="0" y="122" fill="#e2e8f0" font-size="22" font-weight="500">دكتوراه في أمراض الدم السريري</text>
    <text x="0" y="168" fill="#94a3b8" font-size="17">استشارات أمراض الدم · فحوصات CBC · متابعة الحالات المزمنة</text>
    <text x="0" y="218" fill="#c9a227" font-size="18" font-family="JetBrains Mono, monospace" direction="ltr">+964 781 1318002</text>
  </g>
</svg>
